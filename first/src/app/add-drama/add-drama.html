<div class="add-drama">

  <div class="add-card">

    <!-- HEADER -->
    <div class="add-header">

      <div class="add-icon">🎬</div>

      <h2>Drama hinzufügen</h2>

      <p>
        Füge ein neues K-Drama zu deiner Sammlung hinzu.
      </p>

    </div>


    <!-- DRAMA NAME -->
    <label>🎬 Drama Name</label>

    <input
      type="text"
      placeholder="z. B. Queen of Tears"
      [(ngModel)]="name">


    <!-- GENRE -->
    <label>🎭 Genre</label>

    <input
      type="text"
      placeholder="z. B. Romance"
      [(ngModel)]="genre">


    <!-- BEWERTUNG + FOLGEN -->
    <div class="row">

      <div class="col-md-6">

        <label>⭐ Bewertung</label>

        <input
          type="number"
          min="1"
          max="10"
          placeholder="z. B. 9"
          [(ngModel)]="bewertung">

      </div>


      <div class="col-md-6">

        <label>🔢 Folgen</label>

        <input
          type="number"
          min="1"
          placeholder="z. B. 16"
          [(ngModel)]="folgen">

      </div>

    </div>


    <!-- STATUS -->
    <label>📺 Status</label>

    <select [(ngModel)]="status">

      <option value="Noch offen">
        ⏳ Noch offen
      </option>

      <option value="Schaue ich gerade">
        👀 Schaue ich gerade
      </option>

      <option value="Geschaut">
        ✅ Geschaut
      </option>

    </select>


    <!-- BILD -->
    <label>🖼️ Poster</label>

    <div class="poster-upload">

      <div>

      </div>

      <input
        type="file"
        accept="image/*"
        (change)="bildAuswaehlen($event)">

    </div>


    <!-- BUTTON -->
    <button
      type="button"
      (click)="addDrama()">

      ➕ Drama hinzufügen

    </button>

  </div>

</div>
